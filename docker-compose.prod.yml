services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: gpj_postgres_prod
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gpj_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gpj_network_prod
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Security: Run as non-root user
    user: postgres

  # Backend Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: gpj_backend_prod
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/gpj_db}
      - PORT=8000
      # AWS Configuration
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      # JWT Configuration
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=${JWT_EXPIRY:-24h}
      # Google AI
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - gpj_network_prod
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: gpj_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NGINX_HOST=${NGINX_HOST:-localhost}
      - NGINX_PORT=80
    configs:
      - source: nginx_config
        target: /etc/nginx/conf.d/default.conf
    volumes:
      # SSL certificates directory
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # Certbot webroot for ACME challenge
      - ./nginx/certbot:/var/www/certbot:ro
    networks:
      - gpj_network_prod
    depends_on:
      backend:
        condition: service_healthy
    restart: always

configs:
  nginx_config:
    file: ./nginx/default.conf

networks:
  gpj_network_prod:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
