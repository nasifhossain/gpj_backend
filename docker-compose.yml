services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: gpj_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gpj_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gpj_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Application
  backend:
    build: .
    container_name: gpj_backend
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/gpj_db
    volumes:
      # Mount local code to container
      - .:/app
      # Exclude node_modules and generated to use container's versions
      # - /app/node_modules
      # - /app/generated
    networks:
      - gpj_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: sh -c "npx prisma migrate deploy && npm run dev"

  # Prisma Studio - Database Visualizer
  prisma-studio:
    build: .
    container_name: gpj_prisma_studio
    ports:
      - "5555:5555"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/gpj_db
      - BROWSER=none
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - gpj_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: npx prisma studio --port 5555 --browser none

volumes:
  postgres_data:
  

networks:
  gpj_network:
    driver: bridge
